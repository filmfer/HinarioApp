<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hinário Adventista</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Hinário Adventista</h1>
    
    <div class="controls">
      <div class="input-group">
        <button id="selectDirBtn">📁 Pasta</button>
        <span id="currentDirDisplay">Nenhuma pasta selecionada</span>
      </div>

      <div class="input-group">
        <input type="text" id="searchInput" placeholder="Procurar hino..." autofocus>
      </div>

      <div class="input-group">
        <select id="displaySelect">
          <option value="">Monitor...</option>
        </select>
        <button id="refreshDisplays" title="Refresh Monitors">↻</button>
      </div>
    </div>

    <div id="errorBox" class="error hidden"></div>

    <ul id="resultsList" class="results-list"></ul>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
